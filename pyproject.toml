[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downloads-cleaner"
version = "0.1.0"
description = "macOS Downloads folder classifier and safe cleanup tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "downloads-cleaner contributors" }
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
downloads-cleaner = "downloads_cleaner.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
